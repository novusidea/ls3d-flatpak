id: de.novusidea.LS3DLauncher
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.winehq.Wine
base-version: stable-26.08
command: ls3d-launcher

finish-args:
  - --share=ipc
  # Required for 32-bit Windows programs such as the InstallShield installer
  - --allow=multiarch
  - --socket=x11
  - --device=dri
  # Audio output and microphone for voice chat in virtual classrooms
  - --socket=pulseaudio
  # Download of the WBS installer and connection to the LearnSpace backend
  - --share=network
  - --env=WINEDEBUG=-all
  # Wine's ALSA MIDI notify thread never finishes for 32-bit programs (WoW64) in the
  # sandbox, which hangs DxDiag and with it the LearnSpace 3D graphics detection.
  # Audio keeps working via winepulse.drv.
  - --env=WINEDLLOVERRIDES=winealsa.drv=d

add-extensions:
  org.winehq.Wine.gecko:
    directory: share/wine/gecko
    version: stable-26.08

  org.winehq.Wine.mono:
    directory: share/wine/mono
    version: stable-26.08

modules:
  - name: dxvk
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/dxvk/x64 x64/*.dll
      - install -Dm644 -t ${FLATPAK_DEST}/share/dxvk/x32 x32/*.dll
    sources:
      - type: archive
        url: https://github.com/doitsujin/dxvk/releases/download/v3.1.1/dxvk-3.1.1.tar.gz
        sha256: 40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608
        x-checker-data:
          type: json
          url: https://api.github.com/repos/doitsujin/dxvk/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "dxvk-" + $version + ".tar.gz") | .browser_download_url

  - name: ls3d-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 src/ls3d-launcher -t ${FLATPAK_DEST}/bin
      - install -Dm644 data/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 data/icons/${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
      - install -d ${FLATPAK_DEST}/share/wine/gecko ${FLATPAK_DEST}/share/wine/mono
    sources:
      - type: dir
        path: src
        dest: src
      - type: dir
        path: data
        dest: data
